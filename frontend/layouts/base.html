<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Aethon{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {

                    colors: {
                        primary: "#c3f5ff",
                        "primary-container": "#00e5ff",

                        secondary: "#c0c1ff",
                        "secondary-container": "#1a2a4b",

                        background: "#0c1324",
                        surface: "#0c1324",

                        "surface-container-low": "#151b2d",
                        "surface-container-high": "#23293c",
                        "surface-container-highest": "#2e3447",
                        "surface-container-lowest": "#070d1f",

                        "on-background": "#dce1fb",
                        "on-surface": "#dce1fb",
                        "on-surface-variant": "#bac9cc",
                        "on-secondary-container": "#b0b2ff",

                        outline: "#849396",
                        "outline-variant": "#3b494c",

                        error: "#ffb4ab"
                    },

                    spacing: {
                        "container-max-width": "1440px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        gutter: "24px",
                        unit: "4px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },

                    fontSize: {
                        "display-lg": [
                            "48px",
                            {
                                lineHeight: "56px",
                                letterSpacing: "-0.02em",
                                fontWeight: "700"
                            }
                        ],

                        "headline-lg": [
                            "32px",
                            {
                                lineHeight: "40px",
                                letterSpacing: "-0.01em",
                                fontWeight: "600"
                            }
                        ],

                        "headline-md": [
                            "24px",
                            {
                                lineHeight: "32px",
                                fontWeight: "600"
                            }
                        ],

                        "headline-sm": [
                            "20px",
                            {
                                lineHeight: "28px",
                                fontWeight: "600"
                            }
                        ],

                        "body-lg": [
                            "18px",
                            {
                                lineHeight: "28px",
                                fontWeight: "400"
                            }
                        ],

                        "body-md": [
                            "16px",
                            {
                                lineHeight: "24px",
                                fontWeight: "400"
                            }
                        ],

                        "body-sm": [
                            "14px",
                            {
                                lineHeight: "20px",
                                fontWeight: "400"
                            }
                        ],

                        "label-md": [
                            "12px",
                            {
                                lineHeight: "16px",
                                letterSpacing: "0.05em",
                                fontWeight: "600"
                            }
                        ],

                        "label-sm": [
                            "11px",
                            {
                                lineHeight: "14px",
                                letterSpacing: "0.02em",
                                fontWeight: "500"
                            }
                        ]
                    },

                    boxShadow: {
                        cyan: "0 0 40px -10px rgba(0,229,255,0.25)"
                    }
                }
            }
        }
    </script>

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-background text-on-background font-sans min-h-screen">

    {% block main_layout %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}

</body>
</html>
