services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=aethon_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Este volumen anónimo evita que tu compu sobreescriba los node_modules del contenedor
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data: